services:
  - type: web
    name: goldprofx
    env: python
    plan: free
    healthCheckPath: /healthz
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn wsgi:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1"
    disks:
      - name: goldpro-data
        mountPath: /var/data
        sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DB_PATH
        value: /var/data/goldpro_system.db
      - key: GOLDPRO_DATA_DIR
        value: /var/data
      - key: USERS_DB_PATH
        value: /var/data/users.db
      - key: VIP_SUBSCRIPTIONS_DB_PATH
        value: /var/data/vip_subscriptions.db
      - key: VIP_SIGNALS_DB_PATH
        value: /var/data/vip_signals.db
      - key: SIGNALS_DIR
        value: /var/data/signals
      - key: RECOMMENDATIONS_DIR
        value: /var/data/recommendations
      - key: ANALYSIS_DIR
        value: /var/data/analysis
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: BACKGROUND_SERVICES_ENABLED
        value: "1"
      - key: RENDER_SIGNAL_GENERATION_ENABLED
        value: "1"
      - key: CONTINUOUS_ANALYZER_SYMBOLS
        value: "XAUUSD,EURUSD,GBPUSD,USDJPY,BTCUSD,ETHUSD,XAGUSD,US30,NAS100,USOIL"
      - key: CONTINUOUS_ANALYZER_INTERVAL_SECONDS
        value: "180"
      - key: ANALYZER_MAX_INTERVALS_PER_SYMBOL
        value: "1"
      - key: MARKET_DATA_SOURCE_MODE
        value: "auto"
      - key: CRYPTO_DATA_SOURCE_MODE
        value: "yahoo_first"
      - key: ENABLE_MT5_MARKET_DATA
        value: "0"
      - key: MT5_MARKET_DATA_MODE
        value: "disabled"
      - key: ENABLE_YFINANCE_FALLBACK
        value: "1"
      - key: DATA_FETCH_HTTP_TIMEOUT_SECONDS
        value: "6"
      - key: APP_DEBUG
        value: "0"
      - key: DELIVERY_REPORT_DAILY_TIME
        value: "23:55"
      - key: DELIVERY_REPORT_CHECK_INTERVAL_SECONDS
        value: "30"
      - key: LIVE_PRICE_CACHE_TTL_SECONDS
        value: "6"
      - key: LIVE_PRICE_FAIL_CACHE_TTL_SECONDS
        value: "4"
      - key: PUBLIC_BASE_URL
        value: "https://goldprofx-1.onrender.com"
      - key: EMAIL_ACTIVATION_REQUIRED
        value: "0"
      - key: SMTP_ENABLED
        value: "1"
      - key: SMTP_SERVER
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_TIMEOUT_SECONDS
        value: "20"
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MM_TELEGRAM_BOT_TOKEN
        sync: false
      - key: MM_TELEGRAM_CHAT_ID
        sync: false

